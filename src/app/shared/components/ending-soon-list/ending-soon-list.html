<section class="ending-soon--body">
    <main class="ending-soon--main">
        <div class="ending-soon--main--head">
            <h2>Your surveys</h2>
        </div>
        <section class="ending-soon--section">
            <div class="ending-soon--section--head">
                <h3>Ending soon surveys</h3>
            </div>
            <section class="ending-soon--section--list">

                @for (item of endingSoonList; track item) {
                    <div class="ending-soon--section--list--item">
                    <section class="ending-soon--section--list--item--content">
                        <div class="ending-soon--section--list--item--content--top">
                            <p class="ending-soon--section--list--item--content--top--cathegory">
                                {{item.category}}
                            </p>
                            <p class="ending-soon--section--list--item--content--top--main">
                                {{item.content}}
                            </p>
                        </div>

                        <div class="ending-soon--section--list--item--content--ending">
                            
                                <p class="ending-soon--section--list--item--content--ending__highlight">{{item.ending}}</p>
                            
                        </div>
                    </section>
                </div>
                }
            </section>
        </section>
    </main>
</section>
